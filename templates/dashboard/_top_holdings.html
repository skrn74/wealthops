

    
    <hr class="my-4">

    <div class="row mt-4">

    <!-- Top Holdings -->

    <div class="col-lg-6">

        <div class="card shadow-sm">

            <div class="card-header d-flex justify-content-between align-items-center">

                <h5 class="mb-0">🏆 Top Holdings</h5>

                <a href="/portfolio" class="btn btn-sm btn-primary">
                    + Add Holding
                </a>

            </div>

            <div class="card-body">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>Asset</th>

                            <th>Type</th>

                            <th>Current Value</th>

                        </tr>

                    </thead>

                    <tbody>

                    {% for item in top_holdings %}

                    <tr>

                        <td>{{ item.asset_name }}</td>

                        <td>{{ item.asset_type }}</td>

                        <td>
                            ₹ {{ "{:,.2f}".format(item.quantity * item.current_price) }}
                        </td>

                    </tr>

                    {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>
