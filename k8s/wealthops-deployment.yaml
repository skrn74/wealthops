apiVersion: apps/v1
kind: Deployment

metadata:
  name: wealthops
  namespace: wealthops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wealthops

  template:
    metadata:
      labels:
        app: wealthops

    spec:
      containers:
        - name: wealthops
          image: 076194732097.dkr.ecr.us-east-1.amazonaws.com/wealthops:latest
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: wealthops-config
            - secretRef:
                name: wealthops-secrets

          ports:
            - containerPort: 5000