apiVersion: apps/v1
kind: Deployment

metadata:
  name: wealthops
  namespace: wealthops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wealthops

  template:
    metadata:
      labels:
        app: wealthops

    spec:
      imagePullSecrets:
       - name: ecr-secret
      containers:

      - name: wealthops

        image: 076194732097.dkr.ecr.us-east-1.amazonaws.com/wealthops:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:

        - name: DB_HOST
          value: postgres

        - name: DB_PORT
          value: "5432"

        - name: DB_NAME
          value: wealthops

        - name: DB_USER
          value: postgres

        - name: DB_PASSWORD
          value: postgres
        
        - name: UPSTOX_CLIENT_ID
          value: 0d732841-1a7b-4bb2-9f10-1a4ecd5765b3
        
        - name: UPSTOX_CLIENT_SECRET
          value: x2s7rncfkc
        
        - name: UPSTOX_REDIRECT_URI
          value: https://wealthops.local:8443/upstox/callback
        
        - name: UPSTOX_BASE_URL
          value: https://api.upstox.com/v2